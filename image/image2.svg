<svg fill="none" viewBox="0 0 500 123" width="500" height="123" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml"
         style="width:100%; height:100%; display:flex; justify-content:center; align-items:center; flex-direction:column; transform: translateY(10px); font-family: '华文行楷', -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji;">
      <style>
        @keyframes home_sidebar_title_masked_animation__WanzD {
          0% {
            background-position: 350% 0;
          }
          to {
            background-position: -350% 0;
          }
        }

        .home_title {
          font-size: 10vw; /* 响应式字体大小，填满容器 */
          font-weight: 700;
          animation: home_sidebar_title_masked_animation__WanzD 10s linear infinite;
          display: inline-block;
          color: transparent;
          background-image: linear-gradient(-220deg, #fc5c7d, #6a82fb, #05dfd7);
          -webkit-background-clip: text;
          background-clip: text;
          background-size: 200% 120%;
          white-space: nowrap;
          text-align: center;
          line-height: 1;
        }

        h2 {
          display: block;
          font-size: inherit;
          margin: 0;
          font-weight: bold;
        }

        code {
          font-family: monospace;
          font-size: 20px;
        }
      </style>

      <div class="home_title" data-tauri-drag-region="true">
        <h2>𝓌𝑜𝒷.𝓈𝒽𝒶𝓇𝑒</h2>
        <h2>爱探索，爱分享</h2>
      </div>
    </div>
  </foreignObject>
</svg>
